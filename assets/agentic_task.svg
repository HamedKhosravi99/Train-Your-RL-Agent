<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" role="img" aria-label="Flowchart of an agent solving &#x27;What is 37 times 48?&#x27;: read the question, choose a tool (calculator), use the tool, read the result (1,776), decide whether it has enough to answer; if not, choose a tool again; if yes, finish with the answer."><title>Flowchart of an agent solving &#x27;What is 37 times 48?&#x27;: read the question, choose a tool (calculator), use the tool, read the result (1,776), decide whether it has enough to answer; if not, choose a tool again; if yes, finish with the answer.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs><marker id="m7B8794" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#7B8794"/></marker></defs><rect x="0.75" y="0.75" width="898.5" height="928.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">An agent solving a task with a tool</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">Example: “What is 37 × 48?”</text><rect x="140.0" y="140.0" width="400.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="340.0" y="170.9" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Read the question</text><text x="340.0" y="206.7" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">What is 37 × 48?</text><rect x="140.0" y="269.6" width="400.0" height="95.6" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="340.0" y="300.5" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Choose a tool</text><text x="340.0" y="336.3" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">the calculator</text><path d="M340.0 239.6 L340.0 263.6" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><rect x="140.0" y="399.1" width="400.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="340.0" y="430.1" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Use the tool</text><text x="340.0" y="465.8" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">calculator(37 × 48)</text><path d="M340.0 369.1 L340.0 393.1" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><rect x="140.0" y="528.7" width="400.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="340.0" y="559.6" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Read the result</text><text x="340.0" y="595.4" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">1,776</text><path d="M340.0 498.7 L340.0 522.7" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><path d="M340.0 628.2 L340.0 652.2" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><polygon points="340.0,658.2 490.0,718.2 340.0,778.2 190.0,718.2" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6" stroke-linejoin="round"/><text x="340.0" y="705.1" font-size="21" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Enough to</text><text x="340.0" y="731.3" font-size="21" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">answer?</text><rect x="140.0" y="822.2" width="400.0" height="95.6" rx="14" fill="#EEF7F1" stroke="#16803C" stroke-width="2.0"/><text x="340.0" y="853.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Finish</text><text x="340.0" y="888.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">“The answer is 1,776.”</text><path d="M340.0 782.2 L340.0 816.2" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><text x="366.0" y="800.2" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M494.0 718.2 L630.0 718.2 L630.0 317.3 L546.0 317.3" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><text x="646.0" y="503.8" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">no:</text><text x="646.0" y="531.8" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">get more</text><text x="646.0" y="557.8" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">information</text></svg>