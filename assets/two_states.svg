<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Q-learning success path: needs information, uses the right tool (cost 0.02), has the information, finishes (+1), success. Mistakes listed separately: wrong tool -0.15, finishing too early -1, more than 4 moves -0.5."><title>Q-learning success path: needs information, uses the right tool (cost 0.02), has the information, finishes (+1), success. Mistakes listed separately: wrong tool -0.15, finishing too early -1, more than 4 moves -0.5.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs><marker id="m16803C" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#16803C"/></marker></defs><rect x="0.75" y="0.75" width="898.5" height="648.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">Q-learning: the agent&#x27;s two situations</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">It needs information from the right tool before it can finish.</text><rect x="60.0" y="150.0" width="290.0" height="96.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="205.0" y="181.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Needs information</text><text x="205.0" y="216.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">no answer yet</text><rect x="60.0" y="326.0" width="290.0" height="96.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="205.0" y="357.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Has the information</text><text x="205.0" y="392.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">a tool returned it</text><rect x="60.0" y="502.0" width="290.0" height="96.0" rx="14" fill="#EEF7F1" stroke="#16803C" stroke-width="2.0"/><text x="205.0" y="533.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Success</text><text x="205.0" y="569.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">reward +1</text><path d="M205.0 250.0 L205.0 320.0" fill="none" stroke="#16803C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m16803C)"/><text x="225.0" y="272.0" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">uses the right tool</text><text x="225.0" y="299.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">−0.02 points</text><path d="M205.0 426.0 L205.0 496.0" fill="none" stroke="#16803C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m16803C)"/><text x="225.0" y="448.0" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">presses Finish</text><text x="225.0" y="475.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">+1 point</text><line x1="480" y1="150" x2="480" y2="598" stroke="#DDE2E7" stroke-width="1.5"/><text x="520.0" y="166.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Mistakes cost points</text><rect x="520.0" y="204.0" width="332.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="542.0" y="234.9" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Uses the wrong tool</text><text x="542.0" y="270.7" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">still no answer · −0.15</text><rect x="520.0" y="315.6" width="332.0" height="95.6" rx="14" fill="#FCEFEE" stroke="#C2413A" stroke-width="2.0"/><text x="542.0" y="346.5" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Finishes too early</text><text x="542.0" y="382.3" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">the task fails · −1</text><rect x="520.0" y="427.1" width="332.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="542.0" y="458.1" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Takes more than 4 moves</text><text x="542.0" y="493.8" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">time is up · −0.5</text><text x="48.0" y="628.0" font-size="17" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">In RL words: a situation is a state, and pressing a button is an action.</text></svg>