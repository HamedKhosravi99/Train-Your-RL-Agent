<svg xmlns="http://www.w3.org/2000/svg" width="900" height="588" viewBox="0 0 900 588" role="img" aria-label="Learning path with four stages: 1 Q-learning, learn from rewards. 2 REINFORCE, learn which actions are more likely to work. 3 GRPO, compare several attempts. 4 Agentic RL, train an LLM to use tools."><title>Learning path with four stages: 1 Q-learning, learn from rewards. 2 REINFORCE, learn which actions are more likely to work. 3 GRPO, compare several attempts. 4 Agentic RL, train an LLM to use tools.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs></defs><rect x="0.75" y="0.75" width="898.5" height="586.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">Your learning path</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">Four chapters. Each one adds a single new idea.</text><path d="M72.0 183.0 L72.0 501.0" fill="none" stroke="#DDE2E7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="116.0" y="140.0" width="736.0" height="86.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><circle cx="72" cy="183.0" r="24" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="2"/><text x="72.0" y="184.0" font-size="21" font-weight="700" fill="#17202A" text-anchor="middle" dominant-baseline="central">1</text><text x="142.0" y="168.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Q-learning</text><text x="142.0" y="200.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">Learn from rewards.</text><text x="828.0" y="168.0" font-size="17" font-weight="500" fill="#56616D" text-anchor="end" dominant-baseline="central">Chapter 1</text><rect x="116.0" y="246.0" width="736.0" height="86.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><circle cx="72" cy="289.0" r="24" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="2"/><text x="72.0" y="290.0" font-size="21" font-weight="700" fill="#17202A" text-anchor="middle" dominant-baseline="central">2</text><text x="142.0" y="274.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">REINFORCE</text><text x="142.0" y="306.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">Learn which actions are more likely to work.</text><text x="828.0" y="274.0" font-size="17" font-weight="500" fill="#56616D" text-anchor="end" dominant-baseline="central">Chapter 2</text><rect x="116.0" y="352.0" width="736.0" height="86.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><circle cx="72" cy="395.0" r="24" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="2"/><text x="72.0" y="396.0" font-size="21" font-weight="700" fill="#17202A" text-anchor="middle" dominant-baseline="central">3</text><text x="142.0" y="380.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">GRPO</text><text x="142.0" y="412.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">Compare several attempts at the same task.</text><text x="828.0" y="380.0" font-size="17" font-weight="500" fill="#56616D" text-anchor="end" dominant-baseline="central">Chapter 3</text><rect x="116.0" y="458.0" width="736.0" height="86.0" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><circle cx="72" cy="501.0" r="24" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="72.0" 