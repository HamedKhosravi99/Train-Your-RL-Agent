<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Reinforcement learning loop: the agent takes an action (use the calculator), the environment sends feedback (56 is correct, reward +1), the agent learns what worked and tries again."><title>Reinforcement learning loop: the agent takes an action (use the calculator), the environment sends feedback (56 is correct, reward +1), the agent learns what worked and tries again.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs><marker id="m7B8794" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#7B8794"/></marker></defs><rect x="0.75" y="0.75" width="898.5" height="558.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">How reinforcement learning works</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">The agent tries something, the world reacts, and the agent learns.</text><rect x="60.0" y="176.0" width="260.0" height="104.0" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="190.0" y="211.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Agent</text><text x="190.0" y="246.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">decides what to do</text><rect x="580.0" y="176.0" width="260.0" height="104.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="710.0" y="211.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Environment</text><text x="710.0" y="246.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">reacts to the action</text><rect x="580.0" y="392.0" width="260.0" height="104.0" rx="14" fill="#F5F7F9" stroke="#DDE2E7" stroke-width="1.6"/><text x="710.0" y="427.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Agent learns</text><text x="710.0" y="462.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">keeps what worked</text><path d="M324.0 228.0 L574.0 228.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><circle cx="415.7" cy="202.0" r="13" fill="#56616D"/><text x="415.7" y="202.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text><text x="438.7" y="202.0" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Action</text><text x="449.0" y="253.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">use the calculator</text><path d="M710.0 284.0 L710.0 386.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><circle cx="583.6" cy="320.0" r="13" fill="#56616D"/><text x="583.6" y="320.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text><text x="606.6" y="320.0" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Feedback</text><text x="692.0" y="351.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="end" dominant-baseline="central">“56 is correct” · reward +1</text><path d="M576.0 444.0 L190.0 444.0 L190.0 286.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><circle cx="367.1" cy="418.0" r="13" fill="#56616D"/><text x="367.1" y="418.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text><text x="390.1" y="418.0" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">Try again</text><text x="413.0" y="470.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">a little smarter each time</text></svg>