<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-label="REINFORCE: try an episode, get a reward, compare it with the usual reward. Better than usual: make those choices more likely. Worse than usual: make those choices less likely."><title>REINFORCE: try an episode, get a reward, compare it with the usual reward. Better than usual: make those choices more likely. Worse than usual: make those choices less likely.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs><marker id="m7B8794" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#7B8794"/></marker><marker id="m16803C" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#16803C"/></marker><marker id="mC2413A" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#C2413A"/></marker></defs><rect x="0.75" y="0.75" width="898.5" height="728.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">REINFORCE: learn from better-than-usual attempts</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">Was this attempt better or worse than usual?</text><rect x="230.0" y="140.0" width="440.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="450.0" y="170.9" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Try an episode</text><text x="450.0" y="206.7" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">press buttons until Finish</text><rect x="230.0" y="275.6" width="440.0" height="95.6" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="450.0" y="306.5" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Get a reward</text><text x="450.0" y="342.3" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">for example +0.98</text><rect x="230.0" y="411.1" width="440.0" height="95.6" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="450.0" y="442.1" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Compare with usual</text><text x="450.0" y="477.8" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">usual = the average of recent rewards</text><path d="M450.0 239.6 L450.0 269.6" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><path d="M450.0 375.1 L450.0 405.1" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><path d="M450.0 510.7 L450.0 540.7" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/><path d="M450.0 540.7 L240.0 540.7 L240.0 574.7" fill="none" stroke="#16803C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m16803C)"/><path d="M450.0 540.7 L660.0 540.7 L660.0 574.7" fill="none" stroke="#C2413A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mC2413A)"/><rect x="60.0" y="580.7" width="360.0" height="95.6" rx="14" fill="#EEF7F1" stroke="#16803C" stroke-width="2.0"/><text x="240.0" y="611.6" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Better than usual</text><text x="240.0" y="647.4" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">↑ make those choices more likely</text><rect x="480.0" y="580.7" width="360.0" height="95.6" rx="14" fill="#FCEFEE" stroke="#C2413A" stroke-width="2.0"/><text x="660.0" y="611.6" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Worse than usual</text><text x="660.0" y="647.4" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">↓ make those choices less likely</text></svg>