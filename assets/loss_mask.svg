<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="A short conversation: the user asks what 37 times 48 is, the model calls the calculator, the tool returns 1776, and the model answers. Only the two model turns are learned from; the question and the tool result are context the model reads but is not trained to write."><title>A short conversation: the user asks what 37 times 48 is, the model calls the calculator, the tool returns 1776, and the model answers. Only the two model turns are learned from; the question and the tool result are context the model reads but is not trained to write.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs></defs><rect x="0.75" y="0.75" width="898.5" height="638.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">What the LLM learns from</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">It learns from the words it wrote, not from what tools sent back.</text><text x="48.0" y="178.0" font-size="23" font-weight="600" fill="#56616D" text-anchor="start" dominant-baseline="central">User</text><rect x="150.0" y="146.0" width="234.6" height="64.0" rx="14" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.6" stroke-dasharray="7 6"/><text x="174.0" y="178.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">What is 37 × 48?</text><text x="852.0" y="178.0" font-size="18" font-weight="600" fill="#56616D" text-anchor="end" dominant-baseline="central">not trained</text><text x="48.0" y="260.0" font-size="23" font-weight="600" fill="#56616D" text-anchor="start" dominant-baseline="central">Model</text><rect x="150.0" y="228.0" width="421.7" height="64.0" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="174.0" y="260.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">&lt;calculator&gt;37 * 48&lt;/calculator&gt;</text><text x="852.0" y="260.0" font-size="18" font-weight="600" fill="#1D4ED8" text-anchor="end" dominant-baseline="central">learned from</text><text x="48.0" y="342.0" font-size="23" font-weight="600" fill="#56616D" text-anchor="start" dominant-baseline="central">Tool</text><rect x="150.0" y="310.0" width="98.9" height="64.0" rx="14" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.6" stroke-dasharray="7 6"/><text x="174.0" y="342.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">1776</text><text x="852.0" y="342.0" font-size="18" font-weight="600" fill="#56616D" text-anchor="end" dominant-baseline="central">not trained</text><text x="48.0" y="424.0" font-size="23" font-weight="600" fill="#56616D" text-anchor="start" dominant-baseline="central">Model</text><rect x="150.0" y="392.0" width="333.5" height="64.0" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="174.0" y="424.0" font-size="23" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">&lt;answer&gt;1776&lt;/answer&gt;</text><text x="852.0" y="424.0" font-size="18" font-weight="600" fill="#1D4ED8" text-anchor="end" dominant-baseline="central">learned from</text><line x1="48" y1="482" x2="852" y2="482" stroke="#DDE2E7" stroke-width="1.5"/><rect x="48.0" y="510.0" width="28.0" height="28.0" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="92.0" y="524.0" font-size="19" font-weight="500" fill="#17202A" text-anchor="start" dominant-baseline="central">Written by the model: the model learns from it.</text><rect x="48.0" y="560.0" width="28.0" height="28.0" rx="7" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.6" stroke-dasharray="7 6"/><text x="92.0" y="574.0" font-size="19" font-weight="500" fill="#17202A" text-anchor="start" dominant-baseline="central">Question and tool results: the model reads them,</text><text x="92.0" y="602.0" font-size="19" font-weight="500" fill="#17202A" text-anchor="start" dominant-baseline="central">but it is not trained to write them.</text></svg>