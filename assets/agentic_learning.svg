<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Learning cycle: the completed task is checked, the agent receives a reward, and its future decisions improve before the next task."><title>Learning cycle: the completed task is checked, the agent receives a reward, and its future decisions improve before the next task.</title><style>@font-face{font-family:"Inter";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-weight:700;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-kerning:normal}</style><defs><marker id="m7B8794" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#7B8794"/></marker></defs><rect x="0.75" y="0.75" width="898.5" height="498.5" rx="18" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.5"/><text x="48.0" y="58.0" font-size="30" font-weight="700" fill="#17202A" text-anchor="start" dominant-baseline="central">How the agent learns from the whole task</text><text x="48.0" y="96.0" font-size="19" font-weight="500" fill="#56616D" text-anchor="start" dominant-baseline="central">One reward at the end shapes every decision it made.</text><rect x="60.0" y="150.0" width="330.0" height="100.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="225.0" y="183.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Completed task</text><text x="225.0" y="218.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">all the steps it took</text><rect x="510.0" y="150.0" width="330.0" height="100.0" rx="14" fill="#FFFFFF" stroke="#DDE2E7" stroke-width="1.6"/><text x="675.0" y="183.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Check the outcome</text><text x="675.0" y="218.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">Is 1,776 correct?</text><rect x="510.0" y="330.0" width="330.0" height="100.0" rx="14" fill="#F5F7F9" stroke="#DDE2E7" stroke-width="1.6"/><text x="675.0" y="363.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Reward</text><text x="675.0" y="398.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">+1 if correct, −1 if not</text><rect x="60.0" y="330.0" width="330.0" height="100.0" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/><text x="225.0" y="363.2" font-size="23" font-weight="600" fill="#17202A" text-anchor="middle" dominant-baseline="central">Better decisions</text><text x="225.0" y="398.9" font-size="19" font-weight="500" fill="#56616D" text-anchor="middle" dominant-baseline="central">repeat what worked</text><path d="M394.0 200.0 L504.0 200.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><path d="M675.0 254.0 L675.0 324.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><path d="M506.0 380.0 L396.0 380.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><path d="M225.0 326.0 L225.0 256.0" fill="none" stroke="#7B8794" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7B8794)"/><text x="243.0" y="290.0" font-size="18" font-weight="600" fill="#17202A" text-anchor="start" dominant-baseline="central">next task</text></svg>